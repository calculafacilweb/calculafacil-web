<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foro | CalculaFácil</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

:root {
  --blue: #2457d6;
  --blue-dark: #1944b0;
  --bg: #f5f7fc;
  --text: #172033;
  --muted: #68758b;
  --border: #e2e8f2;
  --card: #ffffff;
}

body {
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  margin: 0;
  line-height: 1.6;
}

header {
  background: linear-gradient(135deg, #1944b0, #3977f6);
  color: white;
  padding: 36px 20px;
  box-shadow: 0 4px 18px #173c8c20;
}

.header-inner {
  max-width: 1000px;
  margin: auto;
}

header h1 {
  margin: 0 0 8px;
  font-size: clamp(28px, 5vw, 40px);
  letter-spacing: -1px;
}

header p {
  margin: 0 0 18px;
  color: #e5edff;
}

.back-link {
  display: inline-block;
  color: white;
  text-decoration: none;
  border: 1px solid #ffffff66;
  padding: 8px 13px;
  border-radius: 9px;
  transition: background .2s;
}

.back-link:hover {
  background: #ffffff20;
}

main {
  max-width: 960px;
  margin: 30px auto;
  padding: 0 18px 40px;
}

.card {
  background: var(--card);
  padding: 24px;
  border: 1px solid var(--border);
  border-radius: 16px;
  margin: 18px 0;
  box-shadow: 0 5px 20px #17203308;
}

h2 {
  margin-top: 0;
  letter-spacing: -.4px;
}

input, textarea, select, button {
  font: inherit;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid #ccd5e4;
  width: 100%;
  margin: 7px 0;
}

input, textarea, select {
  background: white;
  color: var(--text);
}

input:focus, textarea:focus, select:focus {
  outline: 3px solid #2457d622;
  border-color: var(--blue);
}

textarea {
  resize: vertical;
  min-height: 110px;
}

button {
  background: var(--blue);
  color: white;
  border: 0;
  cursor: pointer;
  font-weight: bold;
  transition: background .2s, transform .2s;
}

button:hover {
  background: var(--blue-dark);
}

button:active {
  transform: scale(.99);
}

button.secondary {
  background: #eaf0ff;
  color: var(--blue);
}

button.secondary:hover {
  background: #dce6ff;
}

.small {
  color: var(--muted);
  font-size: 14px;
}

.question {
  border-top: 1px solid var(--border);
  padding: 20px 0;
}

.question h3 {
  margin: 0 0 8px;
}

.reply {
  background: #f3f6fc;
  border: 1px solid #e6ebf5;
  padding: 14px;
  border-radius: 10px;
  margin: 10px 0;
  overflow-wrap: anywhere;
}

.hidden {
  display: none !important;
}

a {
  color: var(--blue);
}

@media (max-width: 600px) {
  header {
    padding: 28px 18px;
  }

  main {
    margin-top: 18px;
    padding: 0 12px 28px;
  }

  .card {
    padding: 17px;
    border-radius: 13px;
  }
}
</style>

</head>
<body>

<header>
  <div class="header-inner">
    <h1>CalculaFácil · Foro</h1>
    <p>Tu comunidad para preguntar, aprender y compartir.</p>
    <a class="back-link" href="index.html">← Volver a CalculaFácil</a>
  </div>
</header>

<main>
  <section class="card" id="auth">
    <h2>Tu cuenta</h2>
    <input id="name" placeholder="Nombre visible (para registrarte)">
    <input id="email" type="email" placeholder="Correo electrónico">
    <input id="password" type="password" placeholder="Contraseña (mínimo 6 caracteres)">
    <button id="signup">Crear cuenta</button>
    <button id="login" class="secondary">Iniciar sesión</button>
    <p id="authMsg" class="small">Al registrarte, puede que tengas que confirmar tu correo.</p>
  </section>

  <section class="card hidden" id="userPanel">
    <p id="welcome"></p>
    <button id="logout" class="secondary">Cerrar sesión</button>
  </section>

  <section class="card hidden" id="ask">
    <h2>Publicar una pregunta</h2>
    <select id="subject">
      <option value="Matemáticas">Matemáticas</option>
      <option value="Lengua">Lengua</option>
      <option value="Gallego">Gallego</option>
      <option value="Inglés">Inglés</option>
      <option value="Historia">Historia</option>
      <option value="Economía">Economía</option>
      <option value="Filosofía">Filosofía</option>
      <option value="Física y Química">Física y Química</option>
      <option value="Otras">Otras</option>
    </select>
    <input id="title" maxlength="120" placeholder="Título de la duda">
    <textarea id="body" rows="4" maxlength="5000" placeholder="Explica tu pregunta..."></textarea>
    <button id="publish">Publicar pregunta</button>
    <p id="publishMsg" class="small"></p>
  </section>

  <section class="card">
    <h2>Preguntas de estudiantes</h2>
    <select id="filter">
      <option value="">Todas las asignaturas</option>
      <option>Matemáticas</option><option>Lengua</option><option>Gallego</option>
      <option>Inglés</option><option>Historia</option><option>Economía</option>
      <option>Filosofía</option><option>Física y Química</option><option>Otras</option>
    </select>
    <button id="refresh" class="secondary">Actualizar preguntas</button>
    <div id="questions">Cargando preguntas...</div>
  </section>
</main>

<script>
const SUPABASE_URL = 'https://kimgbvzxeeyheaaqqldz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_W-CDVj04WWHXU3dLNUThPw_8Qde0lZb';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
let currentUser = null;

function message(id, text) { $(id).textContent = text; }
function safe(text) {
  return String(text ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function updateUI() {
  $('auth').classList.toggle('hidden', !!currentUser);
  $('userPanel').classList.toggle('hidden', !currentUser);
  $('ask').classList.toggle('hidden', !currentUser);
  if (currentUser) $('welcome').textContent =
    'Sesión iniciada: ' + (currentUser.user_metadata?.display_name || currentUser.email);
}
async function loadUser() {
  const { data } = await db.auth.getUser();
  currentUser = data.user;
  updateUI();
}
$('signup').onclick = async () => {
  const email = $('email').value.trim(), password = $('password').value;
  const name = $('name').value.trim();
  if (!name) return message('authMsg','Escribe el nombre que verán los demás.');
  if (password.length < 6) return message('authMsg','La contraseña debe tener al menos 6 caracteres.');
  const { data, error } = await db.auth.signUp({
    email, password, options: { data: { display_name: name } }
  });
  if (error) return message('authMsg', error.message);
  if (data.session) {
    currentUser = data.user; updateUI();
    message('authMsg','Cuenta creada correctamente.');
  } else {
    message('authMsg','Revisa tu correo para confirmar la cuenta y después inicia sesión.');
  }
};
$('login').onclick = async () => {
  const { data, error } = await db.auth.signInWithPassword({
    email: $('email').value.trim(), password: $('password').value
  });
  if (error) return message('authMsg',error.message);
  currentUser = data.user; updateUI(); await loadQuestions();
};
$('logout').onclick = async () => {
  await db.auth.signOut(); currentUser = null; updateUI();
};
$('publish').onclick = async () => {
  if (!currentUser) return;
  const title = $('title').value.trim(), body = $('body').value.trim();
  if (title.length < 8 || body.length < 10)
    return message('publishMsg','El título debe tener al menos 8 caracteres y el texto 10.');
  const { error } = await db.from('forum_questions').insert({
    subject: $('subject').value, title, body, user_id: currentUser.id
  });
  if (error) return message('publishMsg','No se pudo publicar: ' + error.message);
  $('title').value = ''; $('body').value = '';
  message('publishMsg','Pregunta publicada.');
  await loadQuestions();
};
async function loadQuestions() {
  const filter = $('filter').value;
  $('questions').textContent = 'Cargando...';
  let query = db.from('forum_questions')
    .select('id,subject,title,body,user_id,created_at')
    .order('created_at',{ascending:false}).limit(100);
  if (filter) query = query.eq('subject',filter);
  const { data, error } = await query;
  if (error) {
    $('questions').textContent = 'Error al cargar: ' + error.message;
    return;
  }
  if (!data.length) {
    $('questions').textContent = 'Todavía no hay preguntas en esta categoría.';
    return;
  }
  $('questions').innerHTML = '';
  for (const q of data) {
    const div = document.createElement('article');
    div.className = 'question';
    div.innerHTML = `
      <p class="small">${safe(q.subject)} · ${safe(new Date(q.created_at).toLocaleString('es-ES'))}</p>
      <h3>${safe(q.title)}</h3>
      <p style="white-space:pre-wrap">${safe(q.body)}</p>
      <div id="replies-${safe(q.id)}"><span class="small">Cargando respuestas...</span></div>
      <form class="replyForm ${currentUser ? '' : 'hidden'}" data-id="${safe(q.id)}">
        <textarea name="reply" rows="2" maxlength="3000" placeholder="Escribe una respuesta..." required></textarea>
        <button>Responder</button>
        <p class="small status"></p>
      </form>
      ${currentUser ? '' : '<p class="small">Inicia sesión para responder.</p>'}
    `;
    $('questions').appendChild(div);
    loadReplies(q.id);
  }
  document.querySelectorAll('.replyForm').forEach(form => {
    form.onsubmit = async e => {
      e.preventDefault();
      const text = form.elements.reply.value.trim();
      if (text.length < 2) return;
      const { error } = await db.from('forum_replies').insert({
        question_id: form.dataset.id, user_id: currentUser.id, body: text
      });
      if (error) form.querySelector('.status').textContent = 'Error: ' + error.message;
      else {
        form.elements.reply.value = '';
        form.querySelector('.status').textContent = 'Respuesta publicada.';
        await loadReplies(form.dataset.id);
      }
    };
  });
}
async function loadReplies(questionId) {
  const target = $('replies-' + questionId);
  if (!target) return;
  const { data, error } = await db.from('forum_replies')
    .select('id,body,created_at').eq('question_id',questionId)
    .order('created_at',{ascending:true});
  if (error) { target.textContent = 'No se pudieron cargar las respuestas.'; return; }
  target.innerHTML = '<h4>Respuestas (' + data.length + ')</h4>';
  for (const r of data) {
    const p = document.createElement('p');
    p.className = 'reply';
    p.style.whiteSpace = 'pre-wrap';
    p.textContent = r.body;
    target.appendChild(p);
  }
}
$('refresh').onclick = loadQuestions;
$('filter').onchange = loadQuestions;
db.auth.onAuthStateChange((_event, session) => {
  currentUser = session?.user || null;
  updateUI();
});
(async () => { await loadUser(); await loadQuestions(); })();
</script>
</body>
</html>
